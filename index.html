<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Us a Review</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 440px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h2 {
      color: #111827;
      font-size: 22px;
      margin-bottom: 6px;
    }
    .header p {
      color: #6b7280;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
    }
    label span {
      color: #ef4444;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #1f2937;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>We Value Your Feedback! 👟</h2>
      <p>Please complete all required fields below to submit your review.</p>
    </div>

    <!-- Connected Formspree Form -->
    <form action="https://formspree.io/f/xqpaljkl" method="POST">
      
      <!-- Required Name -->
      <div class="form-group">
        <label for="name">Your Name <span>*</span></label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <!-- Required Phone Number -->
      <div class="form-group">
        <label for="phone">Phone Number <span>*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. +234 801 234 5678" required>
      </div>

      <!-- Required Email Address (Prevents Formspree validation error) -->
      <div class="form-group">
        <label for="email">Email Address <span>*</span></label>
        <input type="email" id="email" name="email" placeholder="e.g. customer@example.com" required>
      </div>

      <!-- Required Shoe Details -->
      <div class="form-group">
        <label for="shoe_item">Which shoe pair did you purchase? <span>*</span></label>
        <input type="text" id="shoe_item" name="shoe_item" placeholder="e.g. Black Leather Loafers" required>
      </div>

      <!-- Required Rating Dropdown -->
      <div class="form-group">
        <label for="rating">Rating <span>*</span></label>
        <select id="rating" name="rating" required>
          <option value="" disabled selected>Select a rating...</option>
          <option value="5 ⭐⭐⭐⭐⭐">5 ⭐⭐⭐⭐⭐ - Excellent</option>
          <option value="4 ⭐⭐⭐⭐">4 ⭐⭐⭐⭐ - Good</option>
          <option value="3 ⭐⭐⭐">3 ⭐⭐⭐ - Average</option>
          <option value="2 ⭐⭐">2 ⭐⭐ - Poor</option>
          <option value="1 ⭐">1 ⭐ - Very Bad</option>
        </select>
      </div>

      <!-- Required Feedback Text -->
      <div class="form-group">
        <label for="feedback">Your Review <span>*</span></label>
        <textarea id="feedback" name="feedback" rows="4" placeholder="Tell us about your experience..." required></textarea>
      </div>

      <button type="submit">Submit Feedback</button>
    </form>
  </div>

</body>
</html>
